<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PhysicsDen | ArctxFox</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;800&display=swap">
<style>
:root{--ice:#e9f7ff;--sky:#5ec4f5;--sea:#1b86c9;--deep:#0a3d6b;--fox:#f08a2e;--ink:#12324f;--font:"Nunito","Trebuchet MS",Tahoma,"Hiragino Sans","Yu Gothic","Noto Sans JP",Meiryo,sans-serif;--ui:Tahoma,Verdana,"Hiragino Sans","Yu Gothic","Noto Sans JP",Meiryo,sans-serif;--h1:#0a3d6b;--sh:#fff}
@media (prefers-color-scheme:dark){:root{--ice:#0b2238;--ink:#e6f4ff;--h1:#bfe7fb;--sh:#0b2238}}
:root[data-theme="dark"]{--ice:#0b2238;--ink:#e6f4ff;--h1:#bfe7fb;--sh:#0b2238}
:root[data-theme="light"]{--ice:#e9f7ff;--ink:#12324f;--h1:#0a3d6b;--sh:#fff}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:var(--font);color:var(--ink);line-height:1.5;min-height:100vh;display:flex;flex-direction:column;background:radial-gradient(ellipse at 20% 0,rgba(94,196,245,.55),transparent 55%),radial-gradient(ellipse at 90% 30%,rgba(240,138,46,.18),transparent 50%),linear-gradient(180deg,#bfe7fb 0,var(--ice) 45%,var(--ice));background-attachment:fixed}
#snow{position:fixed;inset:0;pointer-events:none;z-index:0;width:100%;height:100%}
:focus-visible{outline:3px solid var(--fox);outline-offset:2px}
.bar{position:relative;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:.6rem 1.2rem;padding:.4rem 1.2rem;background:linear-gradient(180deg,rgba(255,255,255,.85) 0,rgba(190,232,252,.8) 49%,rgba(120,205,245,.75) 50%,rgba(170,225,250,.85) 100%);backdrop-filter:blur(10px);border-bottom:1px solid #fff;box-shadow:0 2px 14px rgba(10,61,107,.3),inset 0 1px 0 #fff}
.brand{display:flex;align-items:center;gap:.6rem;color:#0a3d6b;font-weight:800;font-size:1.25rem}
.brand img{width:42px;height:42px;object-fit:contain;filter:drop-shadow(0 2px 3px rgba(10,61,107,.4))}
.tabs{display:flex;gap:.3rem;margin-left:auto;flex-wrap:wrap}
.tabs button{font:700 .95rem var(--ui);color:#0a3d6b;background:none;border:1px solid transparent;border-radius:6px;padding:.5rem .9rem;cursor:pointer}
.tabs button:hover,.tabs button[aria-selected=true]{background:linear-gradient(#fff,#cdeeff);border-color:#fff;box-shadow:0 0 0 1px var(--sky),0 2px 6px rgba(27,134,201,.4)}
main{position:relative;z-index:1;flex:1;width:min(1080px,94%);margin:1.6rem auto}
h1{font-size:clamp(2rem,5vw,3rem);line-height:1.05;margin:0 0 .4rem;color:var(--h1);letter-spacing:-.02em;text-shadow:0 2px 0 var(--sh)}
.lead{max-width:62ch;margin:0 0 1.4rem}
.mode[hidden]{display:none}
.win{background:#dfe7ee;border:2px solid;border-color:#fff #404a55 #404a55 #fff;box-shadow:5px 5px 0 rgba(10,61,107,.25);color:#12324f;margin-bottom:1.5rem}
.title{display:flex;align-items:center;gap:.4rem;padding:3px 6px;font:700 .85rem var(--ui);color:#fff;background:linear-gradient(90deg,#0a3d6b,#3aa5e3)}
.title i{margin-left:auto;display:flex;gap:2px}
.title button{width:18px;height:16px;padding:0;font:700 13px/1 var(--ui);color:#12324f;background:#dfe7ee;border:1px solid;border-color:#fff #404a55 #404a55 #fff;cursor:pointer;display:grid;place-items:center}.title button:active{border-color:#404a55 #fff #fff #404a55}.win.min .cols{display:none}.win[hidden]{display:none}#lang{font:700 .85rem var(--ui);color:#0a3d6b;background:linear-gradient(#fff,#cdeeff);border:1px solid var(--sky);border-radius:6px;padding:.4rem .8rem;cursor:pointer}
.cols{display:grid;grid-template-columns:290px minmax(0,1fr);gap:1.2rem;padding:1rem 1.2rem}
label{display:block;font:700 .85rem var(--ui);margin:.7rem 0 .15rem}
label:first-child{margin-top:0}
output{font-weight:400;color:var(--sea)}
input[type=range]{width:100%;accent-color:var(--fox)}
select{width:100%;padding:.4rem;font:.9rem var(--ui);border:2px solid;border-color:#404a55 #fff #fff #404a55;background:#fff;color:#111}
canvas.plot{width:100%;display:block;border:2px solid;border-color:#404a55 #fff #fff #404a55;background:#fff;margin-bottom:.6rem}
.btn{display:inline-block;font:700 .85rem var(--ui);padding:.35rem .9rem;border-radius:999px;color:#fff;margin:.5rem .3rem 0 0;border:1px solid var(--sea);cursor:pointer;background:linear-gradient(#bfe7fb,#5ec4f5 50%,#1b86c9 51%,#4fb4e8);box-shadow:inset 0 1px 0 #fff8,0 2px 6px rgba(27,134,201,.45)}
.btn:hover{filter:brightness(1.07)}
.chk{display:flex;gap:.5rem;align-items:center;margin-top:.8rem;font:700 .85rem var(--ui)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:.6rem}
.st{background:linear-gradient(180deg,#fff,#dcf2ff);border:1px solid #fff;border-radius:10px;padding:.4rem .7rem;box-shadow:0 0 0 1px rgba(27,134,201,.35)}
.st b{display:block;font-size:1.15rem;color:#0a3d6b}.st span{font:.75rem var(--ui)}
.note{font:.8rem var(--ui);margin:.6rem 0 0}
#warn{font:700 .85rem var(--ui);color:#b3261e;min-height:1.2em;margin:0 0 .4rem}
footer{position:relative;z-index:1;text-align:center;padding:1.2rem;font:.85rem var(--ui);color:#fff;background:linear-gradient(#1b86c9,#0a3d6b);border-top:2px solid #fff}
@media(max-width:760px){.cols{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>

<script>
const $=s=>document.querySelector(s),g=id=>+$('#'+id).value,clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const sl=(id,l,min,max,step,v,u='')=>`<label for="${id}">${l} <output id="${id}o"></output> ${u}</label><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${v}">`;
const stats=a=>`<div class="stats">${a.map(([i,l])=>`<div class="st"><b id="${i}">–</b><span>${l}</span></div>`).join('')}</div>`;
const win=(t,ctl,out)=>`<div class="win"><div class="title">${t}<i><button type="button" data-a="min" aria-label="Minimize" title="Minimize">–</button><button type="button" data-a="x" aria-label="Close" title="Close (click the tab to reopen)">×</button></i></div><div class="cols"><div>${ctl}</div><div>${out}</div></div></div>`;
const set=(i,v)=>$('#'+i).textContent=v;
const MODES=[['pid','PID controller'],['proj','Projectile range'],['aero','Aerodynamics'],['drone','Drone flight']];
$('#modes').innerHTML=
`<section class="mode" id="m-pid">`+win('PID.exe',
 `<label for="plant">Plant</label><select id="plant"><option value="mass">Mass on a rail (2nd order)</option><option value="lag">Heater (1st order)</option><option value="delay">Heater with 0.5 s delay</option><option value="drone">Drone altitude hold (gravity)</option></select>`+
 sl('sp','Setpoint',0.1,5,0.1,1)+sl('kp','Kp (proportional)',0,30,0.1,6)+sl('ki','Ki (integral)',0,30,0.1,3)+sl('kd','Kd (derivative)',0,15,0.1,3)+
 `<label class="chk"><input type="checkbox" id="dist"> Push the system at t = 6 s</label>
 <button class="btn" data-p="6,0,0">P</button><button class="btn" data-p="6,3,0">PI</button><button class="btn" data-p="6,0,3">PD</button><button class="btn" data-p="6,3,3">PID</button>`,
 `<canvas class="plot" id="pc1" style="height:260px"></canvas><canvas class="plot" id="pc2" style="height:110px"></canvas>`+
 stats([['p1','Overshoot'],['p2','Rise time'],['p3','Settling time (2%)'],['p4','Steady error']])+
 `<p class="note">Control effort is limited to ±20 with anti-windup. Derivative acts on the measurement.</p>`)+`</section>`+
`<section class="mode" id="m-proj" hidden>`+win('Projectile.exe',
 sl('v0','Launch speed',1,100,1,30,'m/s')+sl('ang','Launch angle',0,90,1,45,'°')+sl('h0','Launch height',0,50,1,0,'m')+
 `<label for="gr">Gravity</label><select id="gr"><option value="9.81">Earth 9.81 m/s²</option><option value="1.62">Moon 1.62 m/s²</option><option value="3.71">Mars 3.71 m/s²</option><option value="24.79">Jupiter 24.79 m/s²</option></select>`+
 sl('k','Air drag',0,0.05,0.001,0,'1/m'),
 `<canvas class="plot" id="jc" style="height:340px"></canvas>`+
 stats([['j1','Range'],['j2','Max height'],['j3','Flight time'],['j4','Impact speed'],['j5','Best angle']])+
 `<p class="note">Drag acceleration is k·v², opposite to the velocity. With drag at 0 the best angle on flat ground is 45°.</p>`)+`</section>`+
`<section class="mode" id="m-aero" hidden>`+win('WindTunnel.exe',
 sl('v','Airspeed',5,120,1,40,'m/s')+sl('al','Angle of attack',-10,25,0.5,5,'°')+sl('cam','Camber',0,6,0.5,2,'%')+sl('area','Wing area',0.5,30,0.5,10,'m²')+sl('ar','Aspect ratio',3,15,0.5,8)+sl('alt','Altitude',0,10000,100,0,'m'),
 `<canvas class="plot" id="tun" style="height:300px"></canvas><p id="warn"></p><canvas class="plot" id="cc" style="height:170px"></canvas>`+
 stats([['a1','Lift'],['a2','Drag'],['a3','Lift / drag'],['a4','Lift coeff. CL'],['a5','Reynolds no.'],['a6','Mach'],['a7','Air density']])+
 `<p class="note">A simplified thin-wing model with a soft stall at about 16° from the zero-lift angle. The streamlines are illustrative, not CFD.</p>`)+`</section>`+
`<section class="mode" id="m-drone" hidden>`+win('Drone.exe',
 sl('dm','Takeoff mass',0.2,10,0.1,1.5,'kg')+sl('dc','Battery capacity',500,20000,100,5000,'mAh')+sl('ds','Battery cells',1,12,1,4,'S')+sl('dn','Motors',3,8,1,4)+sl('dd','Propeller diameter',3,24,0.5,9,'in')+sl('dt','Max thrust per motor',200,6000,50,1200,'g')+sl('dcd','Body drag area (CdA)',0.005,0.1,0.005,0.03,'m²')+sl('da','Altitude',0,5000,100,0,'m')+sl('dv','Cruise speed',0,30,0.5,12,'m/s'),
 `<canvas class="plot" id="dc1" style="height:230px"></canvas><canvas class="plot" id="dc2" style="height:200px"></canvas>`+
 stats([['d1','Hover power'],['d2','Hover time'],['d3','Thrust-to-weight'],['d4','Hover throttle (est.)'],['d5','Best endurance speed'],['d6','Best range'],['d7','Flight time at cruise'],['d8','Body tilt at cruise']])+
 `<p class="note">Momentum-theory estimate: 70% rotor figure of merit, 80% drivetrain efficiency, 85% usable battery, 10 W for electronics. Treat results as a first sizing check, not a flight guarantee.</p>`)+`</section>`;

/* plot helper */
const nice=r=>{const p=10**Math.floor(Math.log10(r)),m=r/p;return(m<1.5?1:m<3?2:m<7?5:10)*p};
const fm=v=>String(+v.toPrecision(4));
function plot(cv,S,o){
 const d=devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;if(!w)return;cv.width=w*d;cv.height=h*d;
 const c=cv.getContext('2d');c.setTransform(d,0,0,d,0,0);c.fillStyle='#fff';c.fillRect(0,0,w,h);
 const L=48,R=10,T=10,B=30,[x0,xa]=o.x,[y0,ya]=o.y;
 let sx=(w-L-R)/(xa-x0),sy=(h-T-B)/(ya-y0);if(o.eq)sx=sy=Math.min(sx,sy);
 const x1=x0+(w-L-R)/sx,y1=y0+(h-T-B)/sy,X=v=>L+(v-x0)*sx,Y=v=>h-B-(v-y0)*sy;
 c.font='11px Tahoma,sans-serif';c.lineWidth=1;c.fillStyle='#12324f';c.strokeStyle='#d5e3ee';c.textBaseline='middle';
 let s=nice((x1-x0)/6);c.textAlign='center';
 for(let v=Math.ceil(x0/s)*s;v<=x1+1e-9;v+=s){c.beginPath();c.moveTo(X(v),T);c.lineTo(X(v),h-B);c.stroke();c.fillText(fm(v),X(v),h-B+11)}
 s=nice((y1-y0)/5);c.textAlign='right';
 for(let v=Math.ceil(y0/s)*s;v<=y1+1e-9;v+=s){c.beginPath();c.moveTo(L,Y(v));c.lineTo(w-R,Y(v));c.stroke();c.fillText(fm(v),L-5,Y(v))}
 c.textAlign='center';c.fillText(tt(o.xl||''),L+(w-L-R)/2,h-6);
 c.save();c.translate(11,T+(h-T-B)/2);c.rotate(-Math.PI/2);c.fillText(tt(o.yl||''),0,0);c.restore();
 c.strokeStyle='#404a55';c.strokeRect(L,T,w-L-R,h-T-B);
 c.save();c.beginPath();c.rect(L,T,w-L-R,h-T-B);c.clip();
 S.forEach(q=>{c.setLineDash(q.d||[]);c.strokeStyle=q.c;c.lineWidth=2;c.beginPath();q.p.forEach(([a,b],i)=>i?c.lineTo(X(a),Y(b)):c.moveTo(X(a),Y(b)));c.stroke()});
 c.setLineDash([]);if(o.mk){c.fillStyle=o.mk[2];c.beginPath();c.arc(X(o.mk[0]),Y(o.mk[1]),5,0,7);c.fill()}
 c.restore();c.textAlign='right';
 S.forEach((q,i)=>{if(q.n){c.fillStyle=q.c;c.fillText(tt(q.n),w-R-6,T+11+14*i)}});
}

/* PID */
function pid(){
 const kp=g('kp'),ki=g('ki'),kd=g('kd'),sp=g('sp'),dist=$('#dist').checked,pl=$('#plant').value;
 const dt=.005,N=2400,Ys=[],Us=[],buf=[];let x=0,v=0,I=0,prev=0,hi=sp,lo=0,uh=1,ul=-1;
 for(let i=0;i<N;i++){const t=i*dt,e=sp-x;I+=e*dt;if(ki>0)I=clamp(I,-20/ki,20/ki);
  const u=clamp(kp*e+ki*I-kd*(x-prev)/dt,-20,20);prev=x;
  const d=dist&&t>=6?-3:0,ud=pl==='delay'?(buf[i-100]??0):u;buf.push(u);
  if(pl==='mass'){v+=(u+d-.5*v)*dt;x+=v*dt}else if(pl==='drone'){v+=(Math.max(0,u)+d-9.81-.6*v)*dt;x+=v*dt;if(x<0){x=0;v=Math.max(v,0)}}else x+=dt*((ud+d)-x)/1.5;
  x=clamp(isFinite(x)?x:0,-1e3,1e3);if(i%4==0){Ys.push([t,x]);Us.push([t,u])}
  hi=Math.max(hi,x);lo=Math.min(lo,x);uh=Math.max(uh,u);ul=Math.min(ul,u)}
 const pad=(hi-lo)*.08||.1;
 plot($('#pc1'),[{p:Ys.map(([t])=>[t,sp]),c:'#f08a2e',d:[6,4],n:'Setpoint'},{p:Ys,c:'#1b86c9',n:'Output'}],{x:[0,12],y:[lo-pad,hi+pad],xl:'Time (s)',yl:'Output'});
 plot($('#pc2'),[{p:Us,c:'#6b7f90',n:'Control effort'}],{x:[0,12],y:[ul-1,uh+1],xl:'Time (s)',yl:'u'});
 const lim=dist?1200:N,Y=Ys.map(p=>p[1]),m=lim/4;
 const t10=Ys.find(p=>p[1]>=.1*sp),t90=Ys.find(p=>p[1]>=.9*sp);let ts=null;
 for(let i=m-1;i>=0;i--)if(Math.abs(Y[i]-sp)>.02*sp){ts=i<m-1?Ys[i+1][0]:null;break;}else if(i==0)ts=0;
 set('p1',Math.max(0,(Math.max(...Y.slice(0,m))/sp-1)*100).toFixed(1)+' %');
 set('p2',t10&&t90?(t90[0]-t10[0]).toFixed(2)+' s':tt('never'));
 set('p3',ts==null?tt('not settled'):ts.toFixed(2)+' s');
 set('p4',Math.abs(sp-Y[m-1]).toFixed(3));
}

/* Projectile */
function sim(v,a,h0,gr,k,keep){
 let x=0,y=h0,vx=v*Math.cos(a),vy=v*Math.sin(a),t=0,hm=h0,n=0;const dt=.002,p=keep?[[0,h0]]:null;
 while(t<600){const s=Math.hypot(vx,vy);vx-=k*s*vx*dt;vy+=(-gr-k*s*vy)*dt;const nx=x+vx*dt,ny=y+vy*dt;t+=dt;
  if(ny<0){const f=y/(y-ny||1);x+=(nx-x)*f;t-=dt*(1-f);if(keep)p.push([x,0]);return{x,t,hm,vi:Math.hypot(vx,vy),p}}
  x=nx;y=ny;hm=Math.max(hm,y);if(keep&&++n%5==0)p.push([x,y])}
 return{x,t,hm,vi:0,p};
}
function proj(){
 const v=g('v0'),a=g('ang')*Math.PI/180,h0=g('h0'),gr=g('gr'),k=g('k');
 const r=sim(v,a,h0,gr,k,true),V=k>0?sim(v,a,h0,gr,0,true):null;
 let best=0,bx=-1;for(let d=0;d<=90;d++){const q=sim(v,d*Math.PI/180,h0,gr,k,false).x;if(q>bx){bx=q;best=d}}
 const xm=Math.max(r.x,V?V.x:0,1)*1.05,ym=Math.max(r.hm,V?V.hm:0,1)*1.1;
 plot($('#jc'),[...(V?[{p:V.p,c:'#f08a2e',d:[6,4],n:'No drag'}]:[]),{p:r.p,c:'#1b86c9',n:'Trajectory'}],{x:[0,xm],y:[0,ym],eq:true,xl:'Distance (m)',yl:'Height (m)',mk:[r.x,0,'#f08a2e']});
 set('j1',r.x.toFixed(1)+' m');set('j2',r.hm.toFixed(1)+' m');set('j3',r.t.toFixed(2)+' s');set('j4',r.vi.toFixed(1)+' m/s');set('j5',best+'°');
}

/* Aerodynamics */
const tun=$('#tun'),tc=tun.getContext('2d');let PT=[],AE={};
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
function coef(al,m,AR){
 const e=al+.9*m,ae=Math.abs(e),lim=16,sl=2*Math.PI*AR/(AR+2)*Math.PI/180;
 let c=sl*Math.min(ae,lim);if(ae>lim)c*=Math.max(.55,1-.05*(ae-lim));c*=Math.sign(e);
 return[c,.012+c*c/(Math.PI*.85*AR)+(ae>lim?.02*(ae-lim):0),ae>lim];
}
function aero(){
 const V=g('v'),al=g('al'),m=g('cam'),S=g('area'),AR=g('ar'),h=g('alt');
 const T=288.15-.0065*h,rho=1.225*Math.pow(T/288.15,4.25588),q=.5*rho*V*V,ch=Math.sqrt(S/AR);
 const[CL,CD,st]=coef(al,m,AR);
 AE={V,al,m,CL,CD};
 set('a1',(q*S*CL).toFixed(0)+' N');set('a2',(q*S*CD).toFixed(0)+' N');set('a3',(CL/CD).toFixed(1));set('a4',CL.toFixed(2));
 set('a5',(rho*V*ch/1.81e-5/1e6).toFixed(2)+' M');set('a6',(V/Math.sqrt(401.87*T)).toFixed(2));set('a7',rho.toFixed(3)+' kg/m³');
 $('#warn').textContent=st?tt('Stalled: the airflow has separated, so lift drops and drag climbs.'):'';
 const P=[],D=[];for(let a=-12;a<=25;a+=.5){const c=coef(a,m,AR);P.push([a,c[0]]);D.push([a,c[1]*5])}
 plot($('#cc'),[{p:P,c:'#1b86c9',n:'CL'},{p:D,c:'#f08a2e',d:[6,4],n:'CD × 5'}],{x:[-12,25],y:[-1.5,2],xl:'Angle of attack (°)',yl:'Coefficient',mk:[al,CL,'#12324f']});
 const w=tun.clientWidth,hh=tun.clientHeight;if(!w)return;tun.width=w;tun.height=hh;tc.fillStyle='#cfeeff';tc.fillRect(0,0,w,hh);
 if(!PT.length)for(let i=0;i<150;i++)PT.push({x:Math.random()*w,y:Math.random()*hh});
 if(reduce)for(let i=0;i<150;i++)frame();else if(!raf)loop();
}
let raf=0;
function loop(){if(cur!=='aero'){raf=0;return}frame();raf=requestAnimationFrame(loop)}
function frame(){
 const w=tun.width,h=tun.height,{V,al,m,CL,CD}=AE,C=Math.min(w*.4,230),R=.3*C,cx=w/2,cy=h/2,u=1+V/25,G=CL*R*.4;
 tc.fillStyle='rgba(207,238,255,.22)';tc.fillRect(0,0,w,h);tc.strokeStyle='#1b86c9';tc.lineWidth=1.3;tc.beginPath();
 PT.forEach(p=>{const rx=p.x-cx,ry=p.y-cy,r2=rx*rx+ry*ry+1,r4=r2*r2,R2=R*R;
  let vx=1-R2*(rx*rx-ry*ry)/r4-G*ry/r2,vy=-R2*2*rx*ry/r4+G*rx/r2;
  const nx=p.x+vx*u*2,ny=p.y+vy*u*2;if(r2>R2*.9){tc.moveTo(p.x,p.y);tc.lineTo(nx,ny)}
  p.x=nx;p.y=ny;if(p.x>w+5||r2<R2*.9||p.y<-20||p.y>h+20){p.x=-5-Math.random()*20;p.y=Math.random()*h}});
 tc.stroke();
 const th=al*Math.PI/180,pt=(x,y)=>[cx+(x-.25)*C*Math.cos(th)-(-y*C)*Math.sin(th),cy+(x-.25)*C*Math.sin(th)+(-y*C)*Math.cos(th)];
 const up=[],lo=[],p=.4,mm=m/100;
 for(let i=0;i<=30;i++){const x=(1-Math.cos(i/30*Math.PI))/2,yt=.6*.12*(.2969*Math.sqrt(x)-.126*x-.3516*x*x+.2843*x**3-.1015*x**4),
  yc=mm?(x<p?mm/(p*p)*(2*p*x-x*x):mm/((1-p)**2)*((1-2*p)+2*p*x-x*x)):0;up.push(pt(x,yc+yt));lo.push(pt(x,yc-yt))}
 tc.fillStyle='#0a3d6b';tc.beginPath();[...up,...lo.reverse()].forEach(([a,b],i)=>i?tc.lineTo(a,b):tc.moveTo(a,b));tc.fill();
 const ar=(dx,dy,col,t)=>{tc.strokeStyle=tc.fillStyle=col;tc.lineWidth=3;tc.beginPath();tc.moveTo(cx,cy);tc.lineTo(cx+dx,cy+dy);tc.stroke();
  const a=Math.atan2(dy,dx);tc.beginPath();tc.moveTo(cx+dx,cy+dy);tc.lineTo(cx+dx-9*Math.cos(a-.4),cy+dy-9*Math.sin(a-.4));tc.lineTo(cx+dx-9*Math.cos(a+.4),cy+dy-9*Math.sin(a+.4));tc.fill();
  tc.font='700 12px Tahoma';tc.fillText(tt(t),cx+dx+(dx?8:6),cy+dy-(dy?0:8))};
 ar(0,-clamp(CL*70,-110,110),'#2e9c4a','Lift');ar(clamp(CD*700,6,110),0,'#f08a2e','Drag');
}

function drone(){
 const m=g('dm'),E=g('dc')/1e3*g('ds')*3.7*.85,n=g('dn'),A=n*Math.PI*(g('dd')*.0127)**2,rho=1.225*Math.pow(1-2.25577e-5*g('da'),4.25588),cd=g('dcd'),W=m*9.81;
 const P=V=>{const D=.5*rho*V*V*cd,T=Math.hypot(W,D);let vi=Math.sqrt(T/(2*rho*A));for(let i=0;i<40;i++)vi=.5*vi+.5*T/(2*rho*A*Math.sqrt(V*V+vi*vi));return[(T*vi/.7+D*V)/.8+10,Math.atan2(D,W)*180/Math.PI]};
 const pw=[],rg=[];let ie=0,ir=0;
 for(let i=0;i<=60;i++){const V=i/2,p=P(V)[0];pw.push([V,p]);rg.push([V,V*3.6*E/p]);if(p<pw[ie][1])ie=i;if(rg[i][1]>rg[ir][1])ir=i}
 const vc=g('dv'),[pc,tilt]=P(vc),tw=g('dt')*n*9.81/1000/W;
 plot($('#dc1'),[{p:pw,c:'#1b86c9'}],{x:[0,30],y:[0,Math.max(...pw.map(p=>p[1]))*1.1],xl:'Airspeed (m/s)',yl:'Electrical power (W)',mk:[vc,pc,'#f08a2e']});
 plot($('#dc2'),[{p:rg,c:'#2e9c4a'}],{x:[0,30],y:[0,rg[ir][1]*1.15],xl:'Airspeed (m/s)',yl:'Range (km)',mk:[vc,vc*3.6*E/pc,'#f08a2e']});
 set('d1',pw[0][1].toFixed(0)+' W');set('d2',(60*E/pw[0][1]).toFixed(1)+' min');set('d3',tw.toFixed(2));set('d4',tw<1?'> 100 %':(100/Math.sqrt(tw)).toFixed(0)+' %');
 set('d5',pw[ie][0].toFixed(1)+' m/s');set('d6',rg[ir][1].toFixed(1)+' km');set('d7',(60*E/pc).toFixed(1)+' min');set('d8',tilt.toFixed(1)+'°');
}
